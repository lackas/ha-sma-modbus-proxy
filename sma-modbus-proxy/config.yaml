name: SMA Modbus Proxy
version: "2.2.6"
slug: sma_modbus_proxy
description: >-
  Modbus TCP proxy for SMA SunSpec inverters. Reads SunSpec Model 103/160
  from the inverter and serves them at standard addresses for energy
  management systems (e.g., Viessmann Gridbox). When forward_writes is
  enabled, legacy EMS writes (WMaxLimPct) are translated to SunSpec
  Model 123 writes on the real inverter.
url: "https://github.com/lackas/ha-sma-modbus-proxy"
arch:
  - aarch64
  - amd64
  - armv7
init: false
host_network: true
homeassistant_api: true
options:
  inverter_ip: ""
  device_identifier: "STP 10.0-3AV-40"
  forward_writes: false
  log_level: info
  ha_push: true
schema:
  inverter_ip: str
  device_identifier: "str?"
  forward_writes: bool
  log_level: "list(debug|info|warning)?"
  ha_push: bool
